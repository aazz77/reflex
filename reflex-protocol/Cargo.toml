[package]
name = "reflex-protocol"
description = "reflex 协议层：代理协议入站/出站实现 + 传输层（ws/grpc/xhttp/reality）+ TLS（utls/ech/reality）+ 共享编解码原语"
version.workspace = true
edition.workspace = true

# 协议可选 feature：ssh/tailscale/wireguard 默认关闭，由 reflex-lib 的
# default = ["ssh","tailscale","wireguard"] 透传开启（lib 侧依赖本 crate 时
# 使用 default-features = false，避免 lib 的 --no-default-features 失效）。
[features]
ssh       = ["dep:russh", "dep:dirs", "dep:totp-rs"]
tailscale = ["dep:tailscale"]
wireguard = ["dep:smoltcp"]

[dependencies]
# ── 共享编解码原语（既有） ──────────────────────────────────────────────────
aes                = { version = "0.8"  }
aes-gcm            = { version = "0.10" }
anyhow             = "1"
base64             = "0.22"
blake2             = { version = "0.10" }
blake3             = { version = "1"    }
bytes              = "1"
chacha20poly1305   = { version = "0.10" }
crc32fast          = { version = "1" }
h2                 = "0.4"
hex                = { version = "0.4" }
hkdf               = { version = "0.12" }
http               = "1"
md-5               = { version = "0.10" }
quinn              = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand               = { version = "0.8" }
sha1               = { version = "0.10" }
sha2               = { version = "0.10" }
sha3               = { version = "0.10" }
shadowquic         = { version = "0.3.7", default-features = false, features = ["shadowquic-quinn", "ring"] }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
x25519-dalek       = { version = "2", features = ["static_secrets"] }

# ── inbound/outbound 实现（自 reflex-lib 迁入） ──────────────────────────────
async-trait         = "0.1"
dashmap             = "5"
futures             = "0.3"
futures-util        = "0.3"
hmac                = { version = "0.12" }
http-body           = "1"
http-body-util      = "0.1"
httparse            = "1"
hyper               = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util          = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
libc                = "0.2"
once_cell          = "1"
pin-project-lite    = "0.2"
portable-atomic     = { version = "1", features = ["fallback"] }
prost               = { version = "0.13" }
rustls              = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile      = { version = "2" }
rustls-native-certs = { version = "0.8" }
rcgen               = "0.13"   # REALITY 服务端每连接生成自签名证书（非测试代码）
socket2             = { version = "0.5", features = ["all"] }
tokio-rustls        = { version = "0.26" }
tokio-stream        = { version = "0.1" }
tokio-tungstenite   = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util          = { version = "0.7", features = ["codec"] }
tower               = { version = "0.5", features = ["util"] }
uuid                = { version = "1", features = ["v4"] }

# ── 可选 feature 依赖 ────────────────────────────────────────────────────────
russh      = { version = "0.51", default-features = false, features = ["async-trait"], optional = true }
dirs       = { version = "5", optional = true }
totp-rs    = { version = "5", features = ["serde_support"], optional = true }
tailscale  = { version = "0.3", optional = true }
smoltcp    = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "async",
    "socket-tcp-cubic",
    "proto-ipv4-fragmentation",
    "fragmentation-buffer-size-65536",
    "assembler-max-segment-count-32",
], optional = true }

# quinn-jls / quinn-proto-jls 在 src 里没有直接引用，
# 声明在此是为了用 "=x.y.z" 精确锁定 shadowquic 内部依赖的 JLS quinn 分支版本，
# 防止 cargo update 把它升到不兼容版本。
quinn-jls      = { version = "=0.3.4", default-features = false }
quinn-proto-jls = { version = "=0.3.5", default-features = false }

reflex-common = { path = "../reflex-common" }
reflex-config = { path = "../reflex-config" }
reflex-dns    = { path = "../reflex-dns" }


# cargo-shear 白名单：quinn-jls / quinn-proto-jls 见上方依赖注释。
[package.metadata.cargo-shear]
ignored = ["quinn-jls", "quinn-proto-jls"]
