[package]
name = "reflex-config"
description = "reflex 配置面：Config / InboundConfig / OutboundConfig / DnsConfig / RouteConfig 等 schema 与加载校验"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow      = "1"
hex         = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
tracing     = "0.1"

reflex-common = { path = "../reflex-common" }
