[package]
name = "reflex-netstack"
description = "reflex TUN/netstack：tun 设备、gvisor/smoltcp 双栈、ICMP 转发、平台路由安装"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow        = "1"
async-trait   = "0.1"
bytes         = "1"
futures       = "0.3"
futures-util  = "0.3"
libc          = "0.2"
log           = "0.4"
notify        = { version = "6", default-features = false, features = ["macos_kqueue"] }
once_cell     = "1"
rand          = { version = "0.8" }
smoltcp       = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "async",
    "socket-tcp-cubic",
    # gvisor 栈路径的 IPv4 分片重组（system 栈路径用自研 ip_defrag 模块）
    "proto-ipv4-fragmentation",
    "fragmentation-buffer-size-65536",
    "assembler-max-segment-count-32",
]}
socket2       = { version = "0.5", features = ["all"] }
tokio         = { version = "1", features = ["full"] }
tracing       = "0.1"
tun           = { version = "0.8", features = ["async"] }

reflex-common = { path = "../reflex-common" }
reflex-config = { path = "../reflex-config" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
]}
